[workspace]
channels = ["conda-forge"]
name = "openfe_analysis"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]

[feature.r2-upload.tasks]
upload-data = "python scripts/upload_data.py"
login-r2 = { cmd = "npm ci --no-audit --no-fund && npm exec -- wrangler login --use-keyring", cwd = "scripts/r2-upload" }

[feature.r2-upload.dependencies]
python = ">=3.12,<3.14"
nodejs = ">=24,<25"
rclone = ">=1.76.0,<2"

[environments]
r2-upload = { features = ["r2-upload"], no-default-feature = true }
